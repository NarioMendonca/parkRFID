services:
  api:
    build: ./api
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: file:./data/database.db
      CLIENTS_URL: http://localhost:5050
      TZ: America/Sao_Paulo
    volumes:
      - api-data:/api/data

  app:
    build:
      context: ./app
      args:
        API_URL: http://localhost:3333
    ports:
      - "5050:80"
    depends_on:
      - api

volumes:
  api-data:
